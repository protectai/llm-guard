name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Free disk space
      run: |
        echo "Disk space before cleanup:"
        df -h
        set +e
        # 删除大型工具链和运行时
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/graalvm
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/local/share/chromium
        sudo rm -rf /usr/local/lib/node_modules
        # 清理 apt 缓存和包
        sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-chrome-stable firefox powershell mono-devel >/dev/null 2>&1 || true
        sudo apt-get autoremove -y >/dev/null 2>&1 || true
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        # 清理 Docker
        docker system prune -af --volumes >/dev/null 2>&1 || true
        echo "Disk space after cleanup:"
        df -h
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./llm_guard_api
        file: ./llm_guard_api/Dockerfile
        push: true
        tags: |
          guochengjie/llm-guard-api-offline-cn:latest-simplified
          guochengjie/llm-guard-api-offline-cn:${{ github.run_id }}
        # 将 GitHub Secret 传递给 Docker 构建标识符 [web:20][web:26]
        secrets: |
          "HF_TOKEN=${{ secrets.HF_TOKEN }}"